name: Check CommonJS Require

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  check-require:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for require() Usage
        run: |
          echo "Scanning monorepo for CommonJS require() statements..."
          # Find all js, ts, jsx, tsx, mjs, cjs files containing require(
          # Excluding node_modules, dist, build, etc. if not ignored by git
          REQUIRES_FOUND=$(git grep -n "require(" -- *.js *.ts *.jsx *.tsx *.mjs *.cjs || true)
          
          if [ -n "$REQUIRES_FOUND" ]; then
            echo "::warning::Found the following require() statements:"
            echo "$REQUIRES_FOUND"
            COUNT=$(echo "$REQUIRES_FOUND" | wc -l)
            echo "Total occurrences found: $COUNT"
          else
            echo "🎉 Zero require() statements found! Pure ESM achieved."
          fi
