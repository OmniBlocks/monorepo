name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build packages (Node 20)
        run: |
          pnpm --recursive run --if-present prepublish
          pnpm --recursive run --if-present prepublishOnly

      - name: Build extensions (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build extensions
        run: |
          pnpm --filter extensions run build
