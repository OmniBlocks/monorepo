name: Migrate Off-Topic Issues

on:
  issues:
    types: [labeled]

jobs:
  migrate:
    if: github.event.label.name == 'off-topic'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch data
          TITLE=$(gh issue view ${{ github.event.issue.number }} --json title -q .title)
          BODY=$(gh issue view ${{ github.event.issue.number }} --json body -q .body)
          REPO_ID=$(gh api graphql -f query='{repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {id}}' --jq '.data.repository.id')
          CATEGORY_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                discussionCategories(first: 10) {
                  nodes { id name }
                }
              }
            }' -f owner='${{ github.repository_owner }}' -f repo='${{ github.event.repository.name }}' \
            --jq '.data.repository.discussionCategories.nodes[] | select(.name=="General") | .id')

          # 2. Create Discussion
          DISCUSSION_URL=$(gh api graphql -f query='
            mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repoId, categoryId: $catId, title: $title, body: $body}) {
                discussion { url }
              }
            }' -f repoId=$REPO_ID -f catId=$CATEGORY_ID -f title="$TITLE" -f body="$BODY" \
            --jq '.data.createDiscussion.discussion.url')

          # 3. Comment and Close
          gh issue comment ${{ github.event.issue.number }} --body "This issue is off-topic and has been moved to a discussion: $DISCUSSION_URL"
          gh issue close ${{ github.event.issue.number }} --reason "not_planned"
