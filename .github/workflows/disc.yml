name: Auto-Migrate Off-Topic Issues

on:
  issues:
    types: [opened, edited]

jobs:
  migrate-off-topic:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: write
      contents: read
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Off-Topic Content
        id: ai-check
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o
          prompt: |
            Analyze the following issue and determine if it is off-topic for a technical repository.
            Title: "${{ github.event.issue.title }}"
            Body: "${{ github.event.issue.body }}"
            Answer ONLY with "YES" if it is off-topic, or "NO" if it is on-topic.

      - name: Migrate Issue
        if: steps.ai-check.outputs.response == 'YES'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use your specific ID for "General"
          CAT_ID="DIC_kwDOQLj5ts4C8Q4T"
          REPO_ID=$(gh api graphql -f query='{repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {id}}' --jq '.data.repository.id')

          # Create Discussion
          DISCUSSION_URL=$(gh api graphql -f query='
            mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repoId, categoryId: $catId, title: $title, body: $body}) {
                discussion { url }
              }
            }' -f repoId=$REPO_ID -f catId=$CAT_ID -f title="${{ github.event.issue.title }}" -f body="${{ github.event.issue.body }}" \
            --jq '.data.createDiscussion.discussion.url')

          # Finalize
          gh issue comment ${{ github.event.issue.number }} --body "This issue is off-topic and has been migrated to a discussion: $DISCUSSION_URL"
          gh issue close ${{ github.event.issue.number }} --reason "not planned"
          gh issue lock ${{ github.event.issue.number }} --reason "off-topic"
