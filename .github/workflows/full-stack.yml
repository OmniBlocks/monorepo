name: Full Build Run

on: 
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the build for'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Build OmniBlocks
        run: | 
          pnpm install --no-frozen-lockfile
          mkdir -p test-logs
          cd scratch-gui  
          pnpm run build > build.log 2>&1 || true 
          grep -A 100 -B 20 "ERROR" build.log > ../test-logs/scratch-gui.log || true

      - name: Run Sub-Package Tests
        continue-on-error: true
        run: |
          
          (cd scratch-vm && pnpm test) > test-logs/scratch-vm.log 2>&1 || true
          (cd scratch-render && pnpm test) > test-logs/scratch-render.log 2>&1 || true
          (cd scratch-blocks && pnpm test) > test-logs/scratch-blocks.log 2>&1 || true

      - name: Upload Build Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: test-logs/
          if-no-files-found: error

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-build-dist
          path: |
            scratch-gui/build/
            package.json
            pnpm-lock.yaml
          if-no-files-found: error

  test-matrix:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix: 
        include: 
          - os: windows-latest
            browser: chromium
          - os: windows-latest
            browser: firefox
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: chromium
          - os: macos-latest
            browser: firefox
          - os: macos-latest
            browser: webkit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: full-build-dist

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browser
        run: pnpm exec playwright install ${{ matrix.browser }} --with-deps

      - name: Start Server and Run Playwright Tests
        run: |
          npx http-server scratch-gui/build/ -p 8601 &
          sleep 3
          pnpm exec playwright test tests/example.spec.ts --project=${{ matrix.browser }}
        shell: bash

      - name: Upload Step Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore

  merge-artifacts:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: merged-artifacts

      - name: Filter and Organize Artifacts
        run: |
          rm -rf merged-artifacts/full-build-dist
          ls -R merged-artifacts

      - name: Upload Combined Results
        uses: actions/upload-artifact@v4
        with:
          name: final-test-results
          path: merged-artifacts/
          if-no-files-found: error