name: Moderate Jameson Comments

on:
  issue_comment:
    types: [created, edited]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Process Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const body = comment.body;
            const warning = "> [!WARNING]\n> Opinions related to Jameson are not endorsed by OmniBlocks.\n\n";

            // 1. Prepend warning to the specific comment if "Jameson" is found
            if (body.includes("Jameson") && !body.includes("Opinions related to Jameson are not endorsed by OmniBlocks.")) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: warning + body
              });
            }

            // 2. Thumbs down if specific phrases are found
            if (body.includes("Jameson is better") || body.includes("OmniBlocks is bad")) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                content: "-1"
              });
            }
