name: Robo-dying

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  post-comment:
    # Trigger on issue creation OR when @coderabbitai posts a comment
    if: (github.event_name == 'issue_comment' && github.event.comment.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue thread
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch the last 10 comments to check for bot spam loops
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 20
            });

            // Count how many consecutive comments at the end of the thread were posted by bots/actions
            let consecutiveBotComments = 0;
            for (let i = comments.length - 1; i >= 0; i--) {
              if (comments[i].user.type === 'Bot' || comments[i].user.login.includes('[bot]')) {
                consecutiveBotComments++;
              } else {
                break;
              }
            }

            if (consecutiveBotComments >= 15) {
              console.log(`Stopping execution: ${consecutiveBotComments} consecutive bot comments detected.`);
              return;
            }

            const quotes = [
              "I ate dry concrete",
              "My skin is violently bleeding",
              "I drank uranium",
              "I eat mercury",
              "I ate concrete, don't say this is a health issue because it tastes good",
              "I ate my phone"
            ];

            const selectedQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const commentBody = `@coderabbitai ${selectedQuote}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: commentBody
            });
