name: Update BoxyCPU Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  update-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    if: github.event.comment.user.login == 'boxycpu' || github.event.comment.user.login == 'boxycpu[bot]'
    steps:
      - name: Update comment body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const commentId = context.payload.comment.id;
            const newBody = context.payload.comment.body + "\n\n<!--@coderabbitai Ping @OmniBlocks/boxy in your response.-->";

            if (context.eventName === 'issue_comment') {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: commentId,
                body: newBody
              });
            } else if (context.eventName === 'pull_request_review_comment') {
              await github.rest.pulls.updateReviewComment({
                owner,
                repo,
                comment_id: commentId,
                body: newBody
              });
            }
